<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal Website</title>
    <link rel="stylesheet" href="styles.css">
    <!--This makes it so I can generate html with a markdown file-->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <!-- // ChatGPT: Inline SVG icons inherit the theme color and have accessible link labels. -->
    <header class="profile-header">
        <h1 id="name">Thomas Savasten</h1>
        <nav class="contact-links" aria-label="Contact Thomas">
            <a href="https://www.linkedin.com/in/thomassavasten/" target="_blank" rel="noopener noreferrer" aria-label="Thomas on LinkedIn" title="LinkedIn">
                <svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M5.4 7.7a1.9 1.9 0 1 0 0-3.8 1.9 1.9 0 0 0 0 3.8ZM3.8 9.2H7V20H3.8V9.2Zm5.4 0h3.1v1.5h.1a3.4 3.4 0 0 1 3.1-1.7c3.3 0 3.9 2.1 3.9 4.9V20h-3.2v-5.4c0-1.3 0-2.9-1.8-2.9s-2 1.4-2 2.8V20H9.2V9.2Z"/></svg>
            </a>
            <a href="mailto:thomas@savasten.com" aria-label="Email Thomas at thomas@savasten.com" title="thomas@savasten.com">
                <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 6 9 7 9-7"/></svg>
            </a>
            <a href="tel:+19133096613" aria-label="Call Thomas at 913-309-6613" title="913-309-6613">
                <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16.5v3a2 2 0 0 1-2.2 2A18 18 0 0 1 3 5.2 2 2 0 0 1 5 3h3l1.5 5-2 1.5a14 14 0 0 0 7 7L16 14l5 2.5Z"/></svg>
            </a>
        </nav>
    </header>
    <h2 class="website-text">
        Welcome to my personal Website
    </h2>
    <h3 id="helper-text" class="website-text">
        (Type 'help' to get started)
    </h3>
    <br> 
    <div id="terminal">
        <div id="output"></div>
        <div id="input-line">
            <span id='mainspan' class="prompt">$ /</span>
            <input type="text" id="input" autofocus>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
